description: >-
  FinOps view of ReccoBeats spend. There is effectively nothing to manage on the
  vendor-invoice side: the ReccoBeats API is completely free to use, requires no
  API key, and publishes no metered or tiered pricing. There is no direct cost of
  consumption. The only cost-relevant considerations are indirect - the
  engineering effort to integrate, the internal (undisclosed) rate limits that
  cap throughput, and any client-side compute for preparing audio files for the
  analysis endpoint. Because there is no billing relationship, standard FOCUS
  cost columns carry zero charges.
notes: >-
  No usage-based charges, subscriptions, or contracts are documented as of the
  review date. Should ReccoBeats introduce paid tiers in the future, revisit
  this document to model the metered dimensions (likely requests and/or audio
  analysis operations). Treat availability as best-effort given the free,
  keyless model with internal rate limits.
