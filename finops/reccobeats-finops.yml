meters:
- name: api_requests
  description: Calls to any ReccoBeats endpoint. Free of charge; bounded only by internal rate limits.
  unit: requests
  aggregation: sum
  dimensions:
  - client
  - endpoint
- name: audio_analysis
  description: Audio-file feature extraction operations (POST /v1/analysis/audio-features). Free of charge.
  unit: operations
  aggregation: sum
  dimensions:
  - client
principles:
- name: Visibility
  description: Track request volume per endpoint to stay within ReccoBeats' internal rate limits, even though there is no invoice.
- name: Allocation
  description: Attribute API usage to the internal feature or team consuming it, so throughput needs are understood.
- name: Optimization
  description: Batch lookups via the multiple-track/artist/album endpoints, cache audio features for catalog tracks, and pre-trim audio to 30 seconds / 5 MB before calling the analysis endpoint.
- name: Accountability
  description: Because access is free and keyless, accountability centers on respecting fair-use rate limits and honoring Retry-After rather than on managing spend.
